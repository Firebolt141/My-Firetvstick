name: launcher-tests
# Unit, key-press and screenshot tests of Firebolt Home (launcher/), plus lint.
# Runs when launcher code changes. Does not build or sign an APK (that is launcher-apk).
on:
  push:
    paths: ['launcher/**', '.github/workflows/launcher-tests.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (logic, remote keys, screenshots) and lint
        run: ./gradlew recordRoborazziDebug lintRelease --no-daemon
      - name: Keep the renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ribbon-renders
          path: launcher/app/build/outputs/roborazzi/*.png
          retention-days: 14
