name: launcher-apk
# Builds the Firebolt Home APK (launcher/). Manual only: Actions tab > launcher-apk > Run workflow.
# Needs the signing secrets from scripts/launcher-keystore.sh, so every build is signed with the SAME key and
# installs over the previous one. Without them the job stops instead of producing an APK that can't update.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Add the secrets from scripts/launcher-keystore.sh first (Settings > Secrets and variables > Actions)."; exit 1; }
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease --no-daemon
      - name: Name the APK
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "firebolt-home-$v.apk"
          sha256sum firebolt-home-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: firebolt-home-apk
          path: launcher/firebolt-home-*.apk
          retention-days: 30
