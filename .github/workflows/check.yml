name: check
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debloat lists
        run: scripts/check-lists.sh
      - name: shellcheck
        run: shellcheck -S warning -x -P scripts scripts/*.sh
      - name: Scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
